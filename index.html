<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SRL Hand</title>
        <link rel="stylesheet" href="./src/style.css" />

        <script type="importmap">
            {
                "imports": {
                    "three": "./node_modules/three/build/three.module.js",
                    "three/addons/": "./node_modules/three/examples/jsm/"
                }
            }
        </script>
    </head>
    <body>
        <div class="app">
            <div class="sidebar">
                <h1>SRL Hand</h1>

                <label for="rosbridgeUrlInput">ROS bridge URL</label>
                <input id="rosbridgeUrlInput" type="text" value="ws://localhost:9090" />

                <button id="connectRosButton">Connect ROS</button>

                <label for="colourModeSelect">Colour mode</label>
                <select id="colourModeSelect">
                    <option value="red">Red</option>
                    <option value="gradient">Gradient</option>
                    <option value="hybrid">Hybrid</option>
                </select>

                <button id="calibrateButton">Calibrate Untouched</button>
                <button id="resetViewButton">Reset View</button>
                <button id="clearLogButton">Clear Log</button>

                <p>Status: <span id="status">Not connected</span></p>
                <p>Rate: <span id="frameRate">--</span></p>
                <p>Calibration: <span id="calibrationStatus">Not calibrated</span></p>

                <h3>Last Message</h3>
                <pre id="lastMessage"></pre>
            </div>

            <div class="viewer" id="viewer"></div>
        </div>

        <script type="module" src="./src/main.js"></script>
    </body>
</html>
